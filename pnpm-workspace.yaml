packages:
  - "apps/*"
  - "packages/*"

# Solo estos paquetes pueden ejecutar scripts de instalación (revisados):
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - argon2
# @scarf/scarf es telemetría de descargas: bloqueado.
ignoredBuiltDependencies:
  - "@scarf/scarf"
  - sharp
  - unrs-resolver

# Parche de seguridad transitivo (GHSA-w5hq-g745-h8pq): exceljs fija uuid 8.x
overrides:
  "exceljs>uuid": "^11.1.1"
  # GHSA-r53p-7pc4-xj5r (minimatch, solo herramienta de lint)
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
